<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/animation.css">
    <script type="module" src="script.js" defer></script>
    <title>Pointer Light</title>
</head>

<body>
    <div id="shadow"></div>

    <!-- See: https://developers.google.com/youtube/iframe_api_reference -->
    <div id="iframe" style="pointer-events: none;">
        <div id="player"></div>
    </div>
    <script>
        const start = 122;
        const end = 133;

        // 2. This code loads the IFrame Player API code asynchronously.
        let tag = document.createElement('script');

        tag.src = "https://www.youtube.com/iframe_api";
        let firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 3. This function creates an <iframe> (and YouTube player)
        //    after the API code downloads.
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '390',
                width: '640',
                videoId: 'gbWE47w2oLE',
                playerVars: {
                    playsinline: 1,
                    autoplay: 1, // --- not required right now
                    mute: 1,    // --- not required right now
                    start: start,
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onPlayerStateChange
                }
            });
        }

        // 4. The API will call this function when the video player is ready.
        function onPlayerReady(event) {
            console.log(event.target)
            event.target.playVideo();

            // Fullscreen the video
            go_full_screen();

            setInterval(() => {
                // Loop back to `start` seconds when the video reaches `end` seconds
                if (event.target.playerInfo.currentTime > end) {
                    event.target.seekTo(start);
                    // event.target.playVideo();
                }
            }, 1000)
        }

        // // 5. The API calls this function when the player's state changes.
        // //    The function indicates that when playing a video (state=1),
        // //    the player should play for six seconds and then stop.
        // var done = false;
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                // Unmute the video after 500ms
                setTimeout(() => {
                    event.target.unMute();
                    event.target.playVideo();
                }, 500);
            }
        }

        function go_full_screen() {
            var elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            } else if (elem.mozRequestFullScreen) {
                elem.mozRequestFullScreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        }

    </script>

</body>

</html>
